[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-mentor"
version = "0.1.3"
description = "Reflective routing + data-first mode for scientific manuscript mentor sessions"
authors = [{name = "dalek12310", email = "chunyuchun@qq.com"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "python-docx>=1.1",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/dalek12310/thermal-mentor"
Repository = "https://github.com/dalek12310/thermal-mentor"
Issues = "https://github.com/dalek12310/thermal-mentor/issues"

[tool.setuptools]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -v"
